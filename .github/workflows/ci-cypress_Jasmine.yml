name: CI - Cypress & Jasmine (frontend)

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  cypress-jasmine-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front_end/web/package-lock.json

      - name: Install frontend deps
        working-directory: front_end/web
        run: npm ci

      - name: Setup Chrome for Karma
        uses: browser-actions/setup-chrome@v1

      - name: Run Jasmine (Karma) unit tests
        working-directory: front_end/web
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Start Angular dev server
        working-directory: front_end/web
        run: |
          npm run start -- --host 127.0.0.1 --port 4200 > angular-e2e.log 2>&1 &
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:4200/login > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat angular-e2e.log
            exit 1
          fi

      - name: Run Cypress tests
        working-directory: front_end/web
        run: npm run cypress:run
        env:
          CYPRESS_baseUrl: http://127.0.0.1:4200

      - name: Upload Cypress diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-diagnostics
          path: |
            front_end/web/angular-e2e.log
            front_end/web/cypress/screenshots
          if-no-files-found: ignore
