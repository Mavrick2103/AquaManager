<div class="brand-row">
  <a class="admin-brand" [routerLink]="adminAccess ? '/admin/metrics' : '/admin/articles'">
    <mat-icon>water</mat-icon><span><strong>AquaManager</strong><small>Administration</small></span>
  </a>
  <button
    class="menu-toggle"
    type="button"
    (click)="expanded = !expanded"
    [attr.aria-expanded]="expanded"
    aria-controls="admin-navigation"
    aria-label="Menu d’administration"
  >
    <mat-icon>{{ expanded ? 'close' : 'menu' }}</mat-icon>
  </button>
</div>
<div id="admin-navigation" [class.expanded]="expanded">
  <nav aria-label="Navigation de l’administration">
    @for (group of groups; track group.label) {
      @if (!group.adminOnly || adminAccess) {
        <section>
          <p>{{ group.label }}</p>
          @for (item of group.links; track item.route) {
            <a
              [routerLink]="item.route"
              routerLinkActive="is-active"
              ariaCurrentWhenActive="page"
              (click)="expanded = false"
              ><mat-icon>{{ item.icon }}</mat-icon
              ><span>{{ item.label }}</span></a
            >
          }
        </section>
      }
    }
  </nav>
  <footer>
    <a routerLink="/dashboard"><mat-icon>arrow_back</mat-icon>Retour à l’application</a
    ><a routerLink="/profile"><mat-icon>account_circle</mat-icon>Mon profil</a>
  </footer>
</div>
