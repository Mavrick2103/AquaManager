services:
  db:
    image: mysql:8.0
    container_name: aquamanager_db
    environment:
      MYSQL_DATABASE: ${DB_NAME:-aquamanager}
      MYSQL_USER: ${DB_USER:-aquamanager}
      MYSQL_PASSWORD: ${DB_PASS:-aquamanager}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-rootpass}
    ports:
      - "${DB_HOST_PORT:-127.0.0.1:3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./back_end
      dockerfile: Dockerfile
    container_name: aquamanager_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-aquamanager}
      DB_PASS: ${DB_PASS:-aquamanager}
      DB_NAME: ${DB_NAME:-aquamanager}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES: ${JWT_EXPIRES:-1h}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-15d}

      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-aquamanager.contact@gmail.com}
      ANALYTICS_SALT: ${ANALYTICS_SALT}

      # IA
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL_LUNA: ${OPENAI_MODEL_LUNA:-gpt-4o-mini}

      # STRIPE
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_PREMIUM: ${STRIPE_PRICE_PREMIUM}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL}
      STRIPE_PORTAL_RETURN_URL: ${STRIPE_PORTAL_RETURN_URL}

      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000

      TYPEORM_SYNC: ${TYPEORM_SYNC:-false}
      TYPEORM_LOGGING: ${TYPEORM_LOGGING:-false}

      # UPLOADS
      UPLOAD_DIR: /data/uploads

      # EMAIL Gmail SMTP
      APP_URL: ${APP_URL}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-aquamanager.contact@gmail.com}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM:-AquaManager <aquamanager.contact@gmail.com>}

    ports:
      - "${API_HOST_PORT:-3000}:3000"
    volumes:
      - ${UPLOADS_HOST_PATH:-./data/uploads}:/data/uploads
      - ${TMP_HOST_PATH:-./data/tmp}:/app/tmp

  frontend:
    build:
      context: ./front_end/web
      dockerfile: Dockerfile
    container_name: aquamanager_front
    depends_on:
      - api
    ports:
      - "${FRONT_HTTP_PORT:-80}:80"
      - "${FRONT_HTTPS_PORT:-443}:443"
    volumes:
      - ./front_end/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PORTFOLIO_DIST_PATH:-./data/portfolio-romain}:/var/www/portfolio-romain:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt

  certbot:
    image: certbot/certbot
    container_name: aquamanager_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt

volumes:
  db_data:
  certbot_www:
  certbot_certs: